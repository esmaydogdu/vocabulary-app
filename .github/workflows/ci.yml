name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger deployment when you push to the main branch

permissions:
  contents: write  # Grant write access to the repository contents

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'  # Use Node.js 22 as you requested

      - name: Install dependencies
        run: |
          npm install

      - name: Build the project
        run: |
          npm run generate  # Generate the static files into ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3  
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Use the GitHub token for authentication
          publish_dir: ./dist  # Folder generated by `npm run generate`
          publish_branch: gh-pages  # Deploy to gh-pages branch
          force_orphan: true  # Ensure the deployed content is on the root of the branch

    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
